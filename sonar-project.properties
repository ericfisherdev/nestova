sonar.projectKey=ericfisherdev_nestova
sonar.organization=ericfisherdev-os


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=nestova
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Explicit test classification.
#
# Left unset, the Go analyzer and the text/secrets analyzer apply different
# heuristics and disagree about what a test is: the Go analyzer keys off the
# "_test.go" suffix, while the secrets analyzer also treats any directory named
# -- or ending in -- "test"/"tests"/"doc"/"docs" as tests and skips it. Stating
# it explicitly makes the classification identical for every sensor.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# What is NOT production source.
#
# **/*_templ.go: templ compiles .templ files to *_templ.go, which are committed
# so CI can verify they are in sync -- but they are machine output, and holding
# generated code to hand-written quality standards produces findings nobody can
# act on without regenerating them straight back.
#
# e2e/**: the Playwright suite is developer tooling. It is not compiled into the
# binary, never runs on the appliance, and is not part of `make test` or CI --
# but analysed as production source it dominated the security findings, with
# PATH warnings on every spec's execFileSync helper and a Math.random call in a
# photo fixture. Test code judged by production rules reports risks that do not
# exist for it.
sonar.exclusions=**/*_templ.go,e2e/**

# Duplication only, for the goose migrations. DDL is repetitive by nature --
# 00041_identity_schema_cutover.sql alone was the project's single largest
# duplication contributor -- and a migration is immutable once it has run
# anywhere, so a duplication finding on one can never be acted upon. The files
# stay analysed for everything else; only the copy-paste detector skips them.
sonar.cpd.exclusions=internal/platform/db/migrate/migrations/*.sql

# Coverage denominator only. These files stay fully analysed; they just stop
# counting as lines a test failed to reach.
#
# cmd/server/main.go is dependency wiring: it constructs every repository,
# service and handler and hands them to the router. Exercising it means
# starting the process, which the e2e suite does and `go test` does not, so its
# 607 uncovered lines measured nothing but that fact.
#
# The migration SQL has no executable coverage to report in the first place;
# naming it here keeps the metric's denominator honest rather than relying on
# the Go analyser's silence.
sonar.coverage.exclusions=cmd/server/main.go,internal/platform/db/migrate/migrations/*.sql

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Coverage profile produced by `make test` in the build job and handed to the
# scan as a workflow artifact. Go's native -coverprofile format is read
# directly, so no conversion step is needed.
sonar.go.coverage.reportPaths=coverage.out
