# Conventional Commits enforcement (siderolabs/conform).
#
# Enforced locally via the lefthook commit-msg hook and in CI (see
# CONTRIBUTING.md). conform is pinned as a go.mod tool directive; run it with
# `go tool conform`.
policies:
  - type: commit
    spec:
      header:
        # Max length of the commit subject line.
        length: 100
        # Allow non-imperative subjects (e.g. "fix: updated X").
        imperative: false
        case: lower
        invalidLastCharacters: .
      body:
        required: false
      conventional:
        types:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - build
          - ci
          - perf
          - style
          - revert
        # The scope is the Jira issue key (NES-170). Anchored because conform
        # matches scopes with MatchString, a SUBSTRING match, so an unanchored
        # pattern would also accept "refs-NES-8-followup".
        #
        # This cannot make the key mandatory: conform's conventional check
        # treats an empty scope as valid ("Scope is optional" in
        # check_conventional_commit.go), so a scopeless commit passes here.
        # The pr-title workflow's requireScope is what enforces presence.
        #
        # conform's own `jira` policy is deliberately unused: its regex wants a
        # space before the key, so it rejects the scope form, and it needs an
        # enumerated project list rather than a general pattern.
        scopes:
          - ^[A-Z][A-Z0-9]+-[0-9]+$
