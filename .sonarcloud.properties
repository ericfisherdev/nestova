# Configuration for SonarCloud's automatic analysis (the GitHub App check named
# "SonarCloud Code Analysis"). Automatic analysis reads ONLY this file, from the
# default branch; it ignores sonar-project.properties, which configures the CI
# scan and already excludes generated code (NES-174).
#
# The generated templ output is excluded here for the same reason. Every
# *_templ.go file opens with the same templ scaffolding, which the analysis
# counts as duplicated code, so any PR that touches a .templ file failed the
# new_duplicated_lines_density gate, and the generated files drew code-smell
# findings nobody can act on (NES-208).
#
# SonarCloud does not allow wildcard patterns in this file, so the generated
# files are listed by path. scripts/check-sonarcloud-exclusions.sh (make
# check-sonarcloud-exclusions, run in CI) fails when the lists drift from the
# committed *_templ.go files; --write regenerates them.
sonar.exclusions=web/components/addmember_templ.go,web/components/album_templ.go,web/components/button_templ.go,web/components/calendar_templ.go,web/components/card_templ.go,web/components/dashboard_templ.go,web/components/deeplink_templ.go,web/components/email_notification_templ.go,web/components/groceries_templ.go,web/components/kiosk_templ.go,web/components/layout_templ.go,web/components/login_mfa_templ.go,web/components/login_templ.go,web/components/meals_templ.go,web/components/member_templ.go,web/components/mfa_settings_templ.go,web/components/navpill_templ.go,web/components/newtask_templ.go,web/components/notify_settings_templ.go,web/components/offline_templ.go,web/components/onboarding_templ.go,web/components/passkey_button_templ.go,web/components/photos_templ.go,web/components/pin_settings_templ.go,web/components/rewards_templ.go,web/components/rewardsadmin_templ.go,web/components/settings_templ.go,web/components/setup_templ.go,web/components/subscriptions_templ.go,web/components/tasks_templ.go,web/components/trades_templ.go,web/components/webauthn_settings_templ.go
sonar.cpd.exclusions=web/components/addmember_templ.go,web/components/album_templ.go,web/components/button_templ.go,web/components/calendar_templ.go,web/components/card_templ.go,web/components/dashboard_templ.go,web/components/deeplink_templ.go,web/components/email_notification_templ.go,web/components/groceries_templ.go,web/components/kiosk_templ.go,web/components/layout_templ.go,web/components/login_mfa_templ.go,web/components/login_templ.go,web/components/meals_templ.go,web/components/member_templ.go,web/components/mfa_settings_templ.go,web/components/navpill_templ.go,web/components/newtask_templ.go,web/components/notify_settings_templ.go,web/components/offline_templ.go,web/components/onboarding_templ.go,web/components/passkey_button_templ.go,web/components/photos_templ.go,web/components/pin_settings_templ.go,web/components/rewards_templ.go,web/components/rewardsadmin_templ.go,web/components/settings_templ.go,web/components/setup_templ.go,web/components/subscriptions_templ.go,web/components/tasks_templ.go,web/components/trades_templ.go,web/components/webauthn_settings_templ.go
